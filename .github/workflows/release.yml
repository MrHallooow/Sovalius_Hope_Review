name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npx vite build

      - name: Package Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hope-review-windows-installer
          path: dist/HOPE-Review-Setup-*.exe
          retention-days: 30

  publish-release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: hope-review-windows-installer
          path: artifacts

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "HOPE Review ${{ steps.version.outputs.tag }}"
          body: |
            ## HOPE Review ${{ steps.version.outputs.tag }}

            ### Download
            Download the Windows installer below and run it to install HOPE Review.

            ### Requirements
            - Windows 10 or later (x64)
            - PostgreSQL server (for live database mode)

            ### First Run
            1. Install the app using the Setup `.exe`
            2. Place a `.env` file next to the installed executable with your PostgreSQL credentials
            3. Launch **HOPE Review** from the Start Menu or Desktop shortcut
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
