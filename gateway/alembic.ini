# Alembic config for the H.O.P.E. review gateway.
# The DB URL is injected at runtime from gateway.config.settings
# (env-overridable via GWREV_DB_URL), so it is intentionally not hard-coded.
#
#   cd <repo root>
#   python -m alembic -c gateway/alembic.ini upgrade head
#   python -m alembic -c gateway/alembic.ini revision --autogenerate -m "msg"

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
